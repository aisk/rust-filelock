[package]
name = "filelock"
version = "0.6.0"
edition = "2021"
rust-version = "1.71"
description = "Cross-platform file locking library for Rust"
authors = ["AN Long<aisk1988@gmail.com>"]
repository = "https://github.com/aisk/rust-filelock"
license = "MIT"
readme = "README.md"
keywords = ["file", "lock", "flock", "locking", "mutex"]
categories = ["filesystem", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[features]
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
