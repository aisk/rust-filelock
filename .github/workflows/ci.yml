name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  latest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with all features
      run: cargo test --all-features --verbose

  msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.71
    - name: Run tests on Rust 1.71
      run: cargo test --verbose
    - name: Run Tokio tests on Rust 1.71
      run: cargo test --all-features --verbose

  forced-backport:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      FILELOCK_FORCE_BACKPORT: "1"

    steps:
    - uses: actions/checkout@v6
    - name: Run tests through the compatibility implementation
      run: cargo test --all-features --verbose

  cross-check:
    runs-on: ubuntu-latest
    env:
      FILELOCK_FORCE_BACKPORT: "1"
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-freebsd
          cargo-args: --all-features
        - target: x86_64-unknown-illumos
          cargo-args: --all-features
        - target: wasm32-wasip1
          cargo-args: --no-default-features

    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ matrix.target }}
    - run: cargo check ${{ matrix.cargo-args }} --target ${{ matrix.target }}
